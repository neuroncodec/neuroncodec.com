<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:80},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;articles&quot;,&quot;article&quot;,&quot;projects&quot;,&quot;about&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current || 'home';
    return {
      articlesCurrent: (cur === 'articles' || cur === 'article') ? 'page' : undefined,
      projectsCurrent: cur === 'projects' ? 'page' : undefined,
      aboutCurrent: cur === 'about' ? 'page' : undefined,
    };
  }
}
