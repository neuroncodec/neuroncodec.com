name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOTNET_VERSION: '10.0.x'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      assemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}
      semVer: ${{ steps.gitversion.outputs.semVer }}
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          # GitVersion needs the full history and all tags to compute a version.
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - name: Run gitversion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Show version
        run: |
          echo "AssemblySemVer:       ${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "SemVer:               ${{ steps.gitversion.outputs.semVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"

  build:
    name: Build & test
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >-
          dotnet build --no-restore -c Release
          -p:Version=${{ needs.version.outputs.assemblySemVer }}
          -p:InformationalVersion=${{ needs.version.outputs.informationalVersion }}

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [version, build]
    # Pull requests build the image to prove the Dockerfile works, but never publish it.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.assemblySemVer }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.semVer }}
            org.opencontainers.image.title=neuroncodec.com
            org.opencontainers.image.description=NeuronCodec public site and admin dashboard

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.assemblySemVer }}
            INFORMATIONAL_VERSION=${{ needs.version.outputs.informationalVersion }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
